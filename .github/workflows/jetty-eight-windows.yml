name: Jetty eight pending cases on Windows

on:
  push:
    branches: [jetty-12.1.15-validacion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending:
    if: github.ref == 'refs/heads/jetty-12.1.15-validacion'
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout complete reactor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same as upstream
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17.0.11
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0, same as upstream
        with:
          distribution: temurin
          java-version: '17.0.11+9'
          architecture: x64
          check-latest: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build reactor and execute selected cases
        timeout-minutes: 85
        run: python .github/jetty-pending/run.py run

      - name: Check all eight results in Surefire XML
        if: always()
        timeout-minutes: 5
        run: python .github/jetty-pending/run.py summarize

      - name: Upload logs, XML and case summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetty-eight-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: jetty-eight-results/
          if-no-files-found: error
          retention-days: 30
